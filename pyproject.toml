[project]
name = "bangstats"
version = "0.1.0"
description = "CLI tool for scanning BanG Dream! result screenshots and organizing gameplay data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0",
    "google-genai==1.31.0",
    "httpx>=0.28.1",
    "requests==2.32.5",
    "sqlmodel==0.0.24",
    "loguru==0.7.3",
    "python-dotenv",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
    "pillow>=12.1.1",
    "pillow-heif>=1.3.0",
]


[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "clients/cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

