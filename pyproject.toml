[project]
name = "bangstats"
version = "0.1.0"
description = "CLI tool for scanning BanG Dream! result screenshots and organizing gameplay data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "bangstats-server",
    "bangstats-client",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "clients/cli"]

[tool.uv.sources]
bangstats-server = { workspace = true }
bangstats-client = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
