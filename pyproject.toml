[project]
name = "bangstats"
version = "0.1.0"
description = "CLI tool for scanning BanG Dream! result screenshots and organizing gameplay data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai==1.31.0",
    "requests==2.32.5",
    "sqlmodel==0.0.24",
    "loguru==0.7.3",
    "python-dotenv",
]

[project.scripts]
bangstats = "bangstats.cli.app:run"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bangstats"]
