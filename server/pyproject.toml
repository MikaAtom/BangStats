[project]
name = "bangstats-server"
version = "0.1.0"
description = "BangStats self-hosted API server."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0",
    "bcrypt>=4.3.0",
    "google-genai==1.31.0",
    "loguru==0.7.3",
    "requests==2.32.5",
    "sqlmodel==0.0.24",
    "python-dotenv",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
    "pillow>=12.1.1",
    "pillow-heif>=1.3.0",
]

[project.scripts]
bangstats-server = "bangstats_server.app:run"
heal_screenshot_filenames = "bangstats_server.tools.script_entrypoints:heal_screenshot_filenames"
dedupe_screenshots = "bangstats_server.tools.script_entrypoints:dedupe_screenshots"
list_screenshot_diff = "bangstats_server.tools.script_entrypoints:list_screenshot_diff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bangstats_server"]

