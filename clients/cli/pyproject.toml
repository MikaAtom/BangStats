[project]
name = "bangstats-client"
version = "0.1.0"
description = "BangStats CLI client for API server."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv",
]

[project.scripts]
bangstats = "bangstats_cli.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bangstats_cli"]
